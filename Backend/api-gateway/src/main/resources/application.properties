spring.application.name=api-gateway

# Server

server.port=8080


# Spring Cloud Gateway MVC

spring.cloud.gateway.server.webmvc.routes[0].id=job-search-read-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://job-search-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/jobs/**
spring.cloud.gateway.server.webmvc.routes[0].predicates[1]=Method=GET

spring.cloud.gateway.server.webmvc.routes[1].id=job-write-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://job-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/jobs/**
spring.cloud.gateway.server.webmvc.routes[1].predicates[1]=Method=POST,PUT,DELETE


# Eureka Client

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true


# Actuator

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only


# CORS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true