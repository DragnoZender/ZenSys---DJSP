spring.application.name=consumer-service
server.port=8082

# database configuration

# PostgreSQL (Supabase)
spring.datasource.url=jdbc:postgresql://db.gfidbklzztavhchntmcg.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=ZenSys2498#
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Optional: Format SQL in console
spring.jpa.properties.hibernate.format_sql=true



# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=job-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

#Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

#JSON Deserializer Configuration
spring.kafka.consumer.properties.spring.json.value.default.type=com.zensys.consumer_service.event.JobCommand
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.zensys.consumer_service.event