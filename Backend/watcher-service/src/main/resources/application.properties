spring.application.name=watcher-service
server.port=8084

# PostgreSQL (Supabase)
spring.datasource.url=jdbc:postgresql://db.gfidbklzztavhchntmcg.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=ZenSys2498#
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Watcher Configuration
watcher.polling.interval-ms=20000
watcher.batch-size=1000
watcher.lock-threshold-seconds=30
watcher.run-topic=run

#Logging
logging.level.com.zensys=TRACE